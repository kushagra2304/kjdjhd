# Local run: `docker compose up --build`, then open http://localhost:3000
# (API docs: http://localhost:8000/api/docs)
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    restart: unless-stopped

  frontend:
    build: ./frontend
    ports:
      - "${FRONTEND_PORT:-3000}:80"  # FRONTEND_PORT=3001 docker compose up, if 3000 is taken
    depends_on:
      backend:
        condition: service_healthy  # wait for the backend's /api/health check
    restart: unless-stopped
