<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" font-family="'IBM Plex Sans', 'Segoe UI', system-ui, sans-serif">
  <title>Wind Forecast Monitor: architecture and data flow</title>
  <style>
    .bg { fill: #0a0f16; }
    .band { fill: #101823; stroke: #1f2c3d; stroke-width: 1.5; }
    .box { fill: #152030; stroke: #2a3a50; stroke-width: 1.5; }
    .core { fill: #1d1a10; stroke: #f2b544; stroke-width: 2; }
    .h1 { fill: #e4ebf3; font-size: 28px; font-weight: 600; }
    .sub { fill: #8494a8; font-size: 15px; }
    .band-title { fill: #e4ebf3; font-size: 20px; font-weight: 600; }
    .band-sub { fill: #8494a8; font-size: 13px; }
    .title { fill: #e4ebf3; font-size: 16px; font-weight: 600; }
    .file { font-family: 'IBM Plex Mono', Consolas, monospace; font-size: 12.5px; }
    .text { fill: #9fb0c3; font-size: 13.5px; }
    .label { fill: #8494a8; font-size: 11.5px; font-family: 'IBM Plex Mono', Consolas, monospace; }
    .arrow { stroke: #8494a8; stroke-width: 2; fill: none; }
    .dash { stroke: #8494a8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 5; }
    .num { font-size: 14px; font-weight: 700; fill: #0a0f16; }
    .blue { fill: #4d9dff; } .green { fill: #34d399; } .purple { fill: #a78bfa; } .gold { fill: #f2b544; }
  </style>
  <defs>
    <marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8494a8"/>
    </marker>
  </defs>

  <rect class="bg" width="1600" height="900"/>
  <text class="h1" x="40" y="52">Wind Forecast Monitor · architecture and data flow</text>
  <text class="sub" x="40" y="80">Data is collected once and saved in the repo. Every request is answered from memory, so the app never waits on Elexon.</text>

  <!-- ============ 1 COLLECT ============ -->
  <rect class="band" x="40" y="100" width="380" height="660" rx="14"/>
  <circle class="blue" cx="72" cy="128" r="13"/><text class="num" x="67.5" y="133">1</text>
  <text class="band-title" x="94" y="135">Collect</text>
  <text class="band-sub" x="60" y="158">Offline, run once: python -m scripts.fetch_data</text>

  <rect class="box" x="60" y="174" width="340" height="106" rx="10"/>
  <text class="title" x="80" y="202">Elexon BMRS API</text>
  <text class="file blue" x="80" y="222">data.elexon.co.uk (public)</text>
  <text class="text" x="80" y="246">FUELHH: actual wind, every 30 min</text>
  <text class="text" x="80" y="266">WINDFOR: hourly forecasts, ~8 runs/day</text>

  <rect class="box" x="60" y="320" width="340" height="106" rx="10"/>
  <text class="title" x="80" y="348">Download</text>
  <text class="file blue" x="80" y="368">elexon_client.py</text>
  <text class="text" x="80" y="392">Weekly chunks, retries with backoff</text>
  <text class="text" x="80" y="412">Fails fast on bad requests</text>

  <rect class="box" x="60" y="466" width="340" height="106" rx="10"/>
  <text class="title" x="80" y="494">Clean</text>
  <text class="file blue" x="80" y="514">cleaning.py</text>
  <text class="text" x="80" y="538">Wind only, UTC times, no duplicates</text>
  <text class="text" x="80" y="558">Forecasts kept only if 0–48h ahead</text>

  <rect class="box" x="60" y="612" width="340" height="126" rx="10"/>
  <text class="title" x="80" y="640">Saved data, in the repo</text>
  <text class="file blue" x="80" y="660">backend/data/*.json</text>
  <text class="text" x="80" y="684">1,488 actuals · 11,873 forecasts</text>
  <text class="text" x="80" y="704">About 1 MB, read back and verified</text>
  <text class="text" x="80" y="724">before it is written</text>

  <path class="arrow" d="M230,282 L230,316" marker-end="url(#head)"/>
  <path class="arrow" d="M230,428 L230,462" marker-end="url(#head)"/>
  <path class="arrow" d="M230,574 L230,608" marker-end="url(#head)"/>

  <!-- ============ 2 SERVE ============ -->
  <rect class="band" x="460" y="100" width="480" height="660" rx="14"/>
  <circle class="green" cx="492" cy="128" r="13"/><text class="num" x="487.5" y="133">2</text>
  <text class="band-title" x="514" y="135">Serve</text>
  <text class="band-sub" x="480" y="158">FastAPI backend (Python, pandas)</text>

  <rect class="box" x="480" y="174" width="430" height="106" rx="10"/>
  <text class="title" x="500" y="202">API routes</text>
  <text class="file green" x="500" y="222">main.py · schemas.py</text>
  <text class="text" x="500" y="246">/api/meta · /api/comparison · /api/horizon-error</text>
  <text class="text" x="500" y="266">Checks input, replies with typed JSON</text>

  <rect class="box" x="480" y="320" width="430" height="106" rx="10"/>
  <text class="title" x="500" y="348">Load data once</text>
  <text class="file green" x="500" y="368">data_store.py</text>
  <text class="text" x="500" y="392">Reads the JSON files at start-up</text>
  <text class="text" x="500" y="412">and keeps them in memory</text>

  <rect class="core" x="480" y="466" width="430" height="106" rx="10"/>
  <text class="title" x="500" y="494">Pick the forecast for horizon H</text>
  <text class="file gold" x="500" y="514">forecast_logic.py · the core rule</text>
  <text class="text" x="500" y="538">Latest forecast published at least H hours</text>
  <text class="text" x="500" y="558">before each hour (and at most 48h before)</text>

  <rect class="box" x="480" y="612" width="430" height="126" rx="10"/>
  <text class="title" x="500" y="640">Measure the error</text>
  <text class="file green" x="500" y="660">metrics.py</text>
  <text class="text" x="500" y="684">error = forecast − actual, exact hours only</text>
  <text class="text" x="500" y="704">MAE · RMSE · bias · P90 · biggest miss</text>
  <text class="text" x="500" y="724">Error-by-horizon table, cached</text>

  <path class="arrow" d="M695,282 L695,316" marker-end="url(#head)"/>
  <path class="arrow" d="M695,428 L695,462" marker-end="url(#head)"/>
  <path class="arrow" d="M695,574 L695,608" marker-end="url(#head)"/>
  <!-- result returns to the route -->
  <path class="dash" d="M912,675 L926,675 L926,262 L916,262" marker-end="url(#head)"/>

  <!-- saved data -> load -->
  <path class="dash" d="M402,675 L440,675 L440,373 L476,373" marker-end="url(#head)"/>
  <text class="label" x="0" y="0" transform="translate(452,600) rotate(-90)">loaded at start-up</text>

  <!-- ============ WEB SERVER ============ -->
  <rect class="box" x="980" y="174" width="150" height="200" rx="10"/>
  <text class="title" x="996" y="202">Web server</text>
  <text class="text" x="996" y="230">Docker: nginx</text>
  <text class="text" x="996" y="250">Vercel: rewrites</text>
  <text class="text" x="996" y="282">/api → backend</text>
  <text class="text" x="996" y="302">rest → static site</text>
  <text class="label" x="996" y="340">one URL for</text>
  <text class="label" x="996" y="356">site and API</text>

  <path class="arrow" d="M978,206 L916,206" marker-end="url(#head)"/>
  <path class="arrow" d="M916,240 L976,240" marker-end="url(#head)"/>
  <text class="label" x="938" y="199">ask</text>
  <text class="label" x="934" y="256">JSON</text>

  <!-- ============ 3 SHOW ============ -->
  <rect class="band" x="1170" y="100" width="390" height="660" rx="14"/>
  <circle class="purple" cx="1202" cy="128" r="13"/><text class="num" x="1197.5" y="133">3</text>
  <text class="band-title" x="1224" y="135">Show</text>
  <text class="band-sub" x="1190" y="158">React + TypeScript in the browser</text>

  <rect class="box" x="1190" y="174" width="350" height="106" rx="10"/>
  <text class="title" x="1210" y="202">Data loading</text>
  <text class="file purple" x="1210" y="222">api.ts · hooks.ts</text>
  <text class="text" x="1210" y="246">Typed fetch, cancels stale requests</text>
  <text class="text" x="1210" y="266">Waits 300 ms after the slider settles</text>

  <path class="arrow" d="M1188,206 L1134,206" marker-end="url(#head)"/>
  <path class="arrow" d="M1134,240 L1186,240" marker-end="url(#head)"/>

  <path class="arrow" d="M1365,282 L1365,298" marker-end="url(#head)"/>

  <rect class="box" x="1190" y="302" width="350" height="78" rx="10"/>
  <text class="title" x="1210" y="330">Controls</text>
  <text class="file purple" x="1520" y="330" text-anchor="end">Controls.tsx</text>
  <text class="text" x="1210" y="358">Dates, quick ranges, horizon slider</text>

  <rect class="box" x="1190" y="388" width="350" height="78" rx="10"/>
  <text class="title" x="1210" y="416">Summary cards</text>
  <text class="file purple" x="1520" y="416" text-anchor="end">MetricsCards.tsx</text>
  <text class="text" x="1210" y="444">MAE, P90, bias, % hours over-forecast</text>

  <rect class="box" x="1190" y="474" width="350" height="78" rx="10"/>
  <text class="title" x="1210" y="502">Forecast vs actual</text>
  <text class="file purple" x="1520" y="502" text-anchor="end">GenerationChart.tsx</text>
  <text class="text" x="1210" y="530">Canvas + D3: zoom, pan, brush, error bands</text>

  <rect class="box" x="1190" y="560" width="350" height="78" rx="10"/>
  <text class="title" x="1210" y="588">Error heatmap</text>
  <text class="file purple" x="1520" y="588" text-anchor="end">ErrorHeatmap.tsx</text>
  <text class="text" x="1210" y="616">Canvas: day × hour, click a day to open it</text>

  <rect class="box" x="1190" y="646" width="350" height="92" rx="10"/>
  <text class="title" x="1210" y="674">Error vs horizon</text>
  <text class="file purple" x="1520" y="674" text-anchor="end">HorizonErrorChart.tsx</text>
  <text class="text" x="1210" y="702">SVG + D3: drag the marker to change</text>
  <text class="text" x="1210" y="722">the horizon, synced with the slider</text>

  <!-- ============ FOOTER ============ -->
  <rect class="box" x="40" y="790" width="900" height="80" rx="10"/>
  <text class="title" x="60" y="818">Analysis notebook</text>
  <text class="file gold" x="210" y="818">analysis/forecast_error_analysis.ipynb</text>
  <text class="text" x="60" y="846">Imports forecast_logic.py and metrics.py, so the analysis and the app always give the same numbers.</text>
  <path class="dash" d="M695,788 L695,742" marker-end="url(#head)"/>

  <rect class="box" x="980" y="790" width="580" height="80" rx="10"/>
  <text class="title" x="1000" y="818">Run it</text>
  <text class="text" x="1000" y="846">docker compose up → app on :3000, API on :8000 · or Vercel</text>
</svg>
